<!DOCTYPE html>
<html>
<head>
    <title>Library Management System</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

    <h1>Library Management System</h1>

    <!-- Login Section -->
    <section class="card">
        <h2>Admin Login</h2>

        <input id="username" placeholder="Username">
        <input id="password" type="password" placeholder="Password">

        <button onclick="register()">Register</button>
        <button onclick="login()">Login</button>

        <p id="authMessage"></p>
    </section>


    <!-- Add Book -->
    <section class="card">
        <h2>Add Book</h2>

        <input id="title" placeholder="Book Title">
        <input id="author" placeholder="Author">
        <input id="isbn" placeholder="ISBN">
        <input id="category" placeholder="Category">

        <button onclick="addBook()">Add Book</button>
    </section>


    <!-- Books -->
    <section class="card">
        <h2>Books</h2>

        <input
            id="search"
            placeholder="Search by title, author, ISBN or category"
            onkeyup="loadBooks()"
        >

        <button onclick="loadBooks()">Refresh</button>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>ISBN</th>
                    <th>Category</th>
                    <th>Status</th>
                    <th>Delete</th>
                </tr>
            </thead>

            <tbody id="bookTable"></tbody>
        </table>
    </section>


    <!-- Add Member -->
    <section class="card">
        <h2>Add Member</h2>

        <input id="memberName" placeholder="Member Name">
        <input id="memberEmail" placeholder="Email">
        <input id="memberPhone" placeholder="Phone">

        <button onclick="addMember()">Add Member</button>
    </section>


    <!-- Issue Book -->
    <section class="card">
        <h2>Issue Book</h2>

        <input id="issueBookId" placeholder="Book ID">
        <input id="issueMemberId" placeholder="Member ID">

        <button onclick="issueBook()">Issue Book</button>
    </section>


    <!-- Issued Books -->
    <section class="card">
        <h2>Issued Books</h2>

        <button onclick="loadIssues()">Refresh</button>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Book</th>
                    <th>Member</th>
                    <th>Issue Date</th>
                    <th>Return Date</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="issueTable"></tbody>
        </table>
    </section>

</div>

<script src="/static/script.js"></script>

</body>
</html>
